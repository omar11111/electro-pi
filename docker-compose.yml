services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task-app-php
    restart: unless-stopped
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql
    networks:
      - task-network

  nginx:
    image: nginx:alpine
    container_name: task-app-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - task-network

  mysql:
    image: mysql:8.0
    container_name: task-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - task-network

  # Runs php artisan queue:work so TaskOverdueNotification (ShouldQueue)
  # actually gets processed instead of piling up in the jobs table.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task-app-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql
      - app
    networks:
      - task-network

  # Ticks the Laravel scheduler every minute, which is what actually
  # triggers tasks:check-overdue (scheduled ->daily() in routes/console.php).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task-app-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql
      - app
    networks:
      - task-network

networks:
  task-network:
    driver: bridge

volumes:
  mysql-data:
